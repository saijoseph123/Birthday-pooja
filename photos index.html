<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .gallery-container {
            max-width: 1200px;
            width: 100%;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.2rem;
            letter-spacing: 1px;
            color: #ff6b81;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            background-color: #1e1e1e;
            aspect-ratio: 9 / 16; /* Matches the portrait aspect ratio of your photos */
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(255, 107, 129, 0.3);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="gallery-container">
        <h1>Our Memories</h1>
        <div class="gallery-grid">
            <!-- Photo 1 -->
            <div class="gallery-item">
                <img src="IMG_7961_4410c0.jpg" alt="Memory 1[cite: 1]">
            </div>
            <!-- Photo 2 -->
            <div class="gallery-item">
                <img src="IMG_7960_4410c0.jpg" alt="Memory 2[cite: 2]">
            </div>
            <!-- Photo 3 -->
            <div class="gallery-item">
                <img src="IMG_7959_4410c0.jpg" alt="Memory 3[cite: 3]">
            </div>
            <!-- Photo 4 -->
            <div class="gallery-item">
                <img src="IMG_7958_4410c0.jpg" alt="Memory 4[cite: 4]">
            </div>
            <!-- Photo 5 -->
            <div class="gallery-item">
                <img src="IMG_7956_4410c0.jpg" alt="Memory 5[cite: 5]">
            </div>
            <!-- Photo 6 -->
            <div class="gallery-item">
                <img src="IMG_7955_4410c0.jpg" alt="Memory 6[cite: 6]">
            </div>
        </div>
    </div>

</body>
</html>
